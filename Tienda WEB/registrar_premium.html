<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketRD - Crear Cuenta</title>
    <link rel="stylesheet" href="style/rpremium.css">
</head>
<body>

    <div class="container">
        <!-- Sección Izquierda: TU Logo Real -->
        <div class="logo-section">
            <img src="img/LogoMarketRD.png" alt="MarketRD Logo" class="logo-img">
        </div>

        <!-- Sección Derecha: Formulario -->
        <div class="form-section">
            <div class="form-header">
                <h2>Crear una Cuenta</h2>
                <p>Regístrate en <span class="link-red">MarketRD</span> para comenzar a comprar.</p>
            </div>

            <!-- Formulario conectado a un endpoint real -->
            <form id="registroForm" action="http://localhost:3000/api/registro" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
                </div>

                <p id="mensaje-error" class="error-msg"></p>
                <p id="mensaje-exito" class="success-msg"></p>

                <button type="submit" id="btn-submit" class="btn-submit">Crear Cuenta</button>
            </form>

            <div class="form-footer">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="js/rpremium.js"></script>
</body>
</html>
