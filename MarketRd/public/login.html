<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/login.css">
    <link rel="icon" href="img/LogoIcon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Iniciar Sesión - MarketRD</title>
    <script src="js/login.js" defer></script>
</head>

<body>
    <div class="login-container">
        <div class="login-logo-section">
            <img src="img/LogoMarketRD.png" alt="Logo de MarketRD" class="login-logo" width="100" height="100">
        </div>

        <div class="login-form-section">
            <div class="form-box">
                <h2 class="form-title">Iniciar Sesión</h2>

                <form id="formularioLogin" action="#" method="POST">
                    <div class="input-group">
                        <label for="correo">Correo Electronico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" requirde>

                    </div>

                    <div class="form-links">
                        <p>¿Olvidó su contraseña?<a href="#" id="btnOlvidePassword">Cambiala Aquí!</a></p>
                        <p>¿No tienes una cuenta?<a href="registrar_premium.html">¡Registrate aqui!</a></p>
                    </div>

                    <button type="submit" class="btn-login">Iniciar Sesion</button>
                </form>
            </div>
        </div>
    </div>
    <!-- ===== Modal de Avisos ===== -->
    <div class="modal" id="modalAviso">
        <div class="modal__content">
            <div class="modal__icon" id="modalIcono">
                <!-- El icono se inyecta por JS -->
            </div>
            <h3 class="modal__title" id="modalTitulo">Título</h3>
            <p class="modal__message" id="modalMensaje">Mensaje del modal.</p>
            <button type="button" class="modal__btn" id="modalBoton">Aceptar</button>
        </div>
    </div>
    <!-- ===== Modal para pedir el correo ===== -->
    <div class="modal" id="modalPedirCorreo">
        <div class="modal__content">
            <h3 class="modal__title">Recuperar Contraseña</h3>
            <p class="modal__message">Ingresa tu correo electrónico para enviarte el código de recuperación.</p>

            <form id="formRecuperarCorreo">
                <div class="form-group">
                    <label for="correoRecuperar">Correo electrónico:</label>
                    <input type="email" id="correoRecuperar" required placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="modal__actions">
                    <button type="button" class="btn btn--secondary modal__btn-cerrar">Cancelar</button>
                    <button type="submit" class="btn btn--primary">Enviar código</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.js"></script>
</body>

</html>
