<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra - MarketRD</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <h1>Finalizar compra - MarketRD</h1>

    <h2>Datos del cliente</h2>

    <h2>Resumen de la compra</h2>

    <p>Total a pagar: RD$ <span id="totalCompra">0.00</span></p>

    <form id="formularioPago">

        <label for="nombreCliente">Nombre completo:</label>
        <input type="text" id="nombreCliente" required>

        <br><br>

        <label for="correoCliente">Correo electrónico:</label>
        <input type="email" id="correoCliente" required>

        <br><br>

        <label for="direccionCliente">Dirección de entrega:</label>
        <input type="text" id="direccionCliente" required>

        <br><br>

        <label for="telefonoCliente">Teléfono:</label>
        <input type="tel" id="telefonoCliente" required>

        <br><br>

        <button type="submit">Confirmar compra</button>

    </form>

    <p><a href="carrito.html">Volver al carrito</a></p>

    <script src="checkout.js"></script>

</body>
</html>
