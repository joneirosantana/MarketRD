<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi página</title>
        <link type="text/css" rel="stylesheet" href="style/style.css">
        <link type="favicon" rel="icon" href="favicon.png">
    </head>
    <body>
        <header>
            <div class="logo">
                <img src="img/logo.png" width="auto" height="45" alt="Logo de la página">
            </div>  
            <nav>
                <ul>
                    <li><a href="principal.html">Inicio</a></li>
                    <li><a href="about.html">Acerca de</a></li>
                    <li><a class="active" href="contact.html">Contacto</a></li>
                    <li><a href="portafolio.html">Portafolio</a></li>
                </ul>
            </nav>
            <nav class="login">
                <ul>
                    <li class="login-link"><img src="img/persona.png" alt="Iniciar sesión"></li>
                    <li class="login-link-text"><a href="login.html">Iniciar sesión</a></li>
                    <li><a href="register.html">Registrarse</a></li>
                </ul>
            </nav>
        </header> 
        <div class="banner">
            <img src="img/banner.png" width="100%" height="400" alt="Banner de la página">
        </div>
        <div class="content">
            <h1>Contactanos para darte más información</h1>
            <div class="card">
                <div class="card-content">
                    <h2>Contacto</h2>
                    <b>¿Tienes alguna pregunta?</b>
                    <br>
                    <form action="mailto:ramoncheco@gmail.com" method="post" enctype="text/plain">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                        <br>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                        <br>
                        <label for="message">Mensaje:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                        <br>
                        <input type="submit" value="Enviar">
                </div>
            </div>
        </div>
        <footer>
            <p>&copy; 2026 Mi página. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
